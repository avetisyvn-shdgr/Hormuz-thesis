version: 1
status: "frozen"
drafted_on: "2026-08-26"
p1_gate: "PASSED 2026-08-26 - see docs/MULTI_EVENT_PANEL_COVERAGE_AUDIT.md"
frozen_on: "2026-08-26"
p2_fit: "prototype fitted 2026-08-26 - see docs/PROPAGATION_MODEL_RESULTS.md"

training_window:
  start: "2019-01-01"
  end: "2026-07-12"
  source_snapshot: "data/raw/portwatch/Daily_Chokepoints_Data.csv"

panel:
  unit: "chokepoint_day"
  n_units: 28
  value_columns: ["n_tanker", "n_container", "n_total"]
  primary_value_column: "n_tanker"
  aggregation_allowed: false
  outputs:
    panel: "data/processed/multi_event_panel.csv"
    audit: "data/processed/multi_event_panel_audit.json"

events:
  suez_ever_given:
    unit: "Suez Canal"
    onset: "2021-03-23"
    end: "2021-03-29"
    mechanism: "total_physical_blockage"
    duration_class: "short"
    role: "train"
    observed_n_tanker: "16.7/day baseline -> 4.0/day during -> 21.1/day rebound"
    note: >
      Cape of Good Hope did not respond (12.1 -> 13.3 -> 14.7). A six-day
      closure is shorter than the reroute decision horizon, so this event
      supplies the NO-SUBSTITUTION end of the duration axis. It is available
      only if the training window starts before 2022.

  black_sea_kerch:
    unit: "Kerch Strait"
    onset: "2022-02-24"
    end: null
    mechanism: "conflict_and_sanctions"
    duration_class: "long_progressive"
    role: "train"
    observed_n_tanker: "annual mean 10.9 (2021) -> 6.0 -> 2.2 -> 1.2 (2024) -> 3.9 (2025)"

  panama_drought:
    unit: "Panama Canal"
    onset: "2023-12-19"
    end: "2024-07-31"
    mechanism: "capacity_rationing"
    duration_class: "long"
    role: "train_secondary"
    observed_n_tanker: "12.7 -> 12.1 -> 9.9 (2024H1 trough) -> 12.2 -> 12.6"
    fit_on: ["n_total", "n_tanker"]
    note: >
      WEAK, and not a container story. Trough vs pre-period: tanker -22%,
      container -2%, total -29%. Container traffic was essentially unaffected
      while total transits fell 29%, consistent with slot rationing protecting
      contracted liner services and pushing the cut onto spot, bulk and tanker
      traffic. Fit on n_total and n_tanker. A null Panama result is expected
      and is not evidence the model fails.

  red_sea:
    units: ["Bab el-Mandeb Strait", "Suez Canal"]
    onset: "2024-01-13"
    end: null
    mechanism: "attacks_and_voluntary_avoidance"
    duration_class: "long"
    role: "train_primary"
    observed_n_tanker: >
      Bab el-Mandeb 26.9 -> 10.2, Suez 25.5 -> 14.1, Cape of Good Hope
      10.0 -> 20.5 (monthly means, 2023-10 vs 2024-10).
    fit_on: ["n_container", "n_tanker"]
    note: >
      Treated as ONE event: Bab el-Mandeb and Suez are the same route and must
      not be counted twice. This is the closest analogue to Hormuz and supplies
      the SUBSTITUTION end of the duration axis. The container signal is
      stronger than the tanker signal (Bab el-Mandeb -71% vs -55%, Cape +209%
      vs +104%), so fit both.

  hormuz:
    unit: "Strait of Hormuz"
    onset: "2026-02-28"
    end: null
    mechanism: "attacks_closure_partial_corridors"
    duration_class: "long"
    role: "HELD_OUT"
    seal: >
      SEALED. No Hormuz post-onset observation may enter fitting, model
      selection, or hyperparameter choice at any point in Phases 1-4. Record
      the commit hash and date at which it is unsealed in DECISION_LOG.md
      before running Phase 5.

model:
  form: "low_rank_distributed_lag"
  kernel: "K[c_from -> c_to](h) ~ sum_k u_k[c_from] * v_k[c_to] * f_k(h)"
  rank_k_grid: [1, 2, 3]
  fitted_rank: 1
  horizon_weeks: 8
  lag_horizon_days: 60
  absorb: ["chokepoint_fixed_effects", "calendar_time_effects"]
  selection: "leave_one_event_out"
  sanity_gate:
    description: >
      The fitted kernel must recover a strong positive Bab el-Mandeb ->
      Cape of Good Hope edge. That substitution is known to be real. If no
      (k, H) recovers it, stop and debug rather than tuning until it appears.
    required_edge: ["Bab el-Mandeb Strait", "Cape of Good Hope"]
    required_sign: "positive"

onset_derivation:
  status: "data_derived_pre_registered_rule"
  reason: >
    docs/EVENT_CHRONOLOGY.md covers the Hormuz event only and carries no Red Sea,
    Panama or Black Sea chronology, so onsets could not be adjudicated against it.
    They are derived from the panel itself by a single rule applied identically to
    every candidate, which is more defensible than a hand-picked date.
  sustained_rule: "28-day trailing mean below 0.75 x 365-day pre-baseline, held 14 days"
  sharp_rule: "daily value below 0.50 x baseline on 2 consecutive days"
  hormuz_check: >
    Applied to Hormuz for validation only, the sharp rule returns 2026-03-01,
    one day after the independently locked operational-onset cutoff of
    2026-02-28. The locked cutoff is unchanged and was not derived this way.
  note: >
    Changing any onset invalidates the fitted model. Re-run Phase 2 if edited.

validation:
  scheme: "expanding"
  chronological_only: true
  random_split_prohibited: true
