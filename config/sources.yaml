  # vintage above as primary because this capture revises 97.45% of all 2,750
  # overlapping Hormuz days and 99.67% of the configured 2022--cutoff training
  # days; the configured training mean falls 17.68%. PortWatch records July/
  # August 2026 AIS-spoofing revisions and a March 2026 boundary refinement.
  # See docs/PORTWATCH_VINTAGE_REGISTER.md.
  portwatch_chokepoints_vintage_20260809_snapshot:
    kind: artifact
    role: artifact
    analysis_scope: sensitivity_only
    promotion_policy: "must_not_replace_pinned_primary_without_new_recorded_decision"
    allowed_consumers:
      - "scripts/verify_sensitivity_inputs.py"
      - "scripts/run_portwatch_vintage_sensitivity.py"
      - "scripts/run_rebound_relapse_profile.py"
      - "scripts/run_revision_and_basin_exploration.py"
      - "src/lngfreight/vintage_matrix.py"
      # Added 2026-08-27 on Mher's instruction for Track B phase B1. The audit
      # reads this vintage as the SECOND measurement state of a revision audit
      # (see config/hormuz_measurement_audit.yaml). It does not promote the
      # vintage, substitute it for the pinned primary, or average the two, so
      # `promotion_policy` above is not engaged.
      - "scripts/run_hormuz_measurement_audit.py"
      # Added 2026-08-28 on Mher's instruction, SOLELY for Track A phase A4.
      # A4 scores the frozen detector under July and August as two separate
      # measurement states and reports their disagreement; that disagreement is
      # the deliverable. Mher's authorisation is explicit that this "does not
      # promote or average the August vintage": the config keeps
      # `measurement_states.never_join_or_average: true`, A4 asserts it at
      # runtime, and no A4 output mixes the two states into one number. The
      # pinned July state remains the primary reference, so `promotion_policy`
      # above is not engaged. This entry authorises no other phase.
      - "scripts/run_hormuz_detection.py"
    description: "Candidate 2026-08-09 PortWatch chokepoint vintage; vintage-sensitivity use only."
    status: free
    primary:
      provider: frozen_artifact
      path: "data/raw/portwatch/vintages/Daily_Chokepoints_Data__vintage_2026-08-09.csv"
      media_type: "text/csv"
