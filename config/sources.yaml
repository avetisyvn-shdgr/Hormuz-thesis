# =====================================================================
# SERIES REGISTRY
# ---------------------------------------------------------------------
# This is the single source of truth that decouples the THESIS VARIABLE
# (a logical name your analysis code refers to) from the PROVIDER that
# happens to supply it today.
#
# When TUM Bloomberg / Spark access arrives you change ONLY this file:
# flip the relevant `status` to `primary`, point `provider`/`code` at
# the proprietary feed, and the pipeline keeps running unchanged.
#
# status values:
#   primary     - the assessment the proposal actually wants (proprietary)
#   proxy       - a free, imperfect stand-in used under the fallback branch
#   free        - a free series that IS the real thing (no proprietary gap)
#   restricted  - opt-in local data with explicit provenance/licence limits;
#                 never included in the default free-data panel
#   unavailable - no free option exists yet; slot reserved for later access
#
# role values (maps to the proposal's panel):
#   target      - dependent variable (LNG spot freight)
#   energy      - energy-price confounder set
#   route       - route-capacity / chokepoint covariate
#   mechanism   - operational ton-mile mechanism proxy
#   importer    - importer-side LNG outcome series (Option D / propagation
#                 finding; monthly national-customs by-origin data)
# =====================================================================

variables:

  # ---- TARGET: LNG spot freight (the proposal's dependent variable) ----
  spark30s_atlantic_freight:
    role: target
    description: "Atlantic LNG freight, Sabine Pass -> Gate (174k m3, 2-stroke)."
    status: unavailable          # proprietary Spark assessment
    primary:
      provider: spark
      code: "Spark30S"
      license: "Spark Commodities subscription; free-trial/academic access being pursued (see docs/DATA_SOURCES.md, decision 2026-06-14)."
    # Proxy DEMOTED 2026-06-14: ICE LNG-freight-futures settlement has NO verified
    # free EOD feed (ICE/Barchart are licensed; EEX does not list these futures).
    # It is NOT a free fallback. Do not build an ice_settlement fetch until a
    # genuinely free source is confirmed. The realistic free route is the Spark
    # free-trial/academic API (provider: spark), which returns the real assessment
    # if its history reaches the study window. See docs/DATA_SOURCES.md.
    proxy:
      provider: ice_settlement
      code: "Spark30S-FUT-M1"    # front-month LNG freight future settlement
      note: "UNVERIFIED ACCESS. Futures settlement != daily physical spot (basis/roll/timing risk) AND no confirmed free EOD feed. Document explicitly if ever used."

  spark25s_pacific_freight:
    role: target
    description: "Pacific LNG freight, North West Shelf -> Tianjin (174k m3, 2-stroke)."
    status: unavailable
    primary:
      provider: spark
      code: "Spark25S"
      license: "Spark Commodities subscription; free-trial/academic access being pursued (see docs/DATA_SOURCES.md, decision 2026-06-14)."
    # Proxy DEMOTED 2026-06-14: see spark30s_atlantic_freight note above.
    proxy:
      provider: ice_settlement
      code: "Spark25S-FUT-M1"
      note: "UNVERIFIED ACCESS. Same caveat as Spark30S: futures != spot AND no confirmed free EOD feed."

