# Study window. Pre-period must be long enough for rolling-origin validation;
# post-period is deliberately short (the proposal warns about overfitting here).
study_window:
  full_start: "2022-01-01"     # generous pre-history for baselines/seasonality
  full_end:   "2026-07-07"   # v2 extension: PortWatch max 2026-07-12 minus 5-day buffer (v1 primary window ended 2026-06-01)
  # Locked pre-treatment boundary for the working throughput estimand.
  # Training uses dates strictly before this date and post scoring includes it.
  # This is the operational onset, not a claim that every legal, military, and
  # commercial component of the disruption began simultaneously.
  primary_treatment_cutoff: "2026-02-28"
  # Event milestones — re-audited 2026-06-19 (see docs/EVENT_CHRONOLOGY.md).
  # Cross-checked vs the AIS transit collapse in the panel
  # (Hormuz transits: Feb27=53, Feb28=44, Mar1=7, Mar2=2, Mar4=0).
  # These define sensitivity scoring windows. They do NOT move the fixed
  # pre-treatment training boundary above.
  treatment_candidates:
    kinetic_trigger:       "2026-02-28"   # US operation begins; first observed
                                          # break in Hormuz tanker throughput.
    closure_declaration:   "2026-03-02"   # Closure-confirmation milestone;
                                          # operational collapse already underway.
    force_majeure:         "2026-03-04"   # QatarEnergy primary announcement.
    # regime_consolidation DROPPED 2026-06-14: 03-10 had no documented
    # consolidation event (analyst construct). Closure hardening is gradual, so
    # persistence is handled by a ROLLING POST-PERIOD WINDOW in the modeling
    # phase, not a discrete date. 2026-04-18 (Iran's formal closure) is reserved
    # as a PLACEBO/falsification date, not a treatment candidate.
  # Documented context milestones (NOT treatment candidates; event-study
  # annotation / robustness only):
  #   2026-03-04      QatarEnergy declares force majeure; IRGC also claims
  #                   'complete control' of the strait.
  #   2026-03-05      war-risk P&I insurance withdrawn -> effective closure.
  #   2026-03-18/19   Later Ras Laffan escalation; ~17% LNG capacity damaged.
  #   2026-03-27      IRGC bans vessels to/from US/Israel-allied ports (AFP).
  #   2026-04-18      Iran's formal closure statement.

# Step-4 alignment / imputation policy. Applied downstream of build_panel,
# never inside the data layer (panel_free.csv stays the honest, un-filled state).
# Discipline: forward-fill only (past -> present); NEVER interpolate or backfill,
# both of which leak a future observation into the present.
imputation:
  # Price columns (registry role energy/target) are business-day series mapped
  # onto a calendar index. Carry the last observed price forward across
  # non-trading days, but ONLY up to this many consecutive calendar days, so a
  # genuine data outage cannot be laundered into fabricated observations.
  # Weekends = 2 days, long weekends/holidays = 3-4; 4 covers these without
  # masking a real multi-day gap. Beyond the cap the cell stays NaN (flagged).
  price_ffill_max_gap_days: 4
  # PortWatch capacity artifact: days where transit COUNT > 0 but deadweight
  # capacity logged 0 (AIS rounding / sub-resolution vessels). These are
  # logically inconsistent with a true zero. "mask" -> set capacity to NaN so it
  # cannot masquerade as a genuine closure-zero; "keep" -> trust the raw 0.
  # Every change is recorded in the audit log either way.
  capacity_zero_with_transits: "mask"   # mask | keep

# Phase-4 modeling policy. TARGET-AGNOSTIC: this block governs HOW models are
# trained and validated, never WHICH series is the dependent variable (still
# unresolved pending Spark/Bloomberg access). Adding it now does not commit the
# thesis to any target choice.
modeling:
  # Authorized engineering specification for the working free-data fallback.
  # This locks the implemented analysis only. Formal proposal/RQ/hypothesis
  # realignment remains pending explicit Prof. Li confirmation; see
  # docs/PENDING_ESTIMAND_REALIGNMENT_DRAFT.md.
  working_specification:
    status: "working_primary_pending_formal_estimand_confirmation"
    branch: "fallback_portwatch"
    primary_outcome: "hormuz_tanker_transits"
    robustness_outcome: "hormuz_tanker_capacity"
    active_secondary_outcomes: []
    dormant_secondary_outcomes:
      - "spark30s_atlantic_freight"
      - "spark25s_pacific_freight"
    primary_estimator: "ar_lag1_7"
    benchmark_estimators:
      - "seasonal_naive_7d"
    conditional_sensitivity_estimators:
      - "arx_lag1_7_route"
      - "arx_lag1_7_route_energy"
    reporting_term: "disruption-associated counterfactual shortfall"
    transformer_enabled: false
    transformer_reentry_rule: >-
      Only if pre-treatment fit and interval coverage improve materially, or
      Prof. Li makes a Transformer a hard architecture requirement.

  # Chronological rolling-origin validation (src/lngfreight/validation.py).
  # Discipline: training+validation use ONLY pre-treatment data; never random-split.
  validation:
    scheme: "expanding"          # expanding (growing train) | sliding (fixed-length train)
    initial_train_days: 365      # first origin: >=1 yr of pre-history so seasonality is learnable
    horizon_days: 30             # length of each out-of-sample test fold
    step_days: 30                # how far the origin advances between folds
    sliding_train_days: 365      # train-window length when scheme == sliding (ignored if expanding)
    max_folds: null              # cap the number of folds (null = as many as the history allows)
    # Training+validation stay STRICTLY before this date so no fold sees the
    # disruption regime. "auto" = study_window.primary_treatment_cutoff;
    # or pin an explicit YYYY-MM-DD.
    cutoff: "auto"

reproducibility:
  random_seed: 20260612
  timezone: "UTC"

bsts:
  variance_prior_shape: 2.5
  observation_prior_scale_multiplier: 0.5
  level_prior_scale_multiplier: 0.5
  prior_sensitivity_scale_multipliers: [0.1, 0.5, 2.0]
  prior_sensitivity_draws: 500
  prior_sensitivity_burn: 300

long_horizon_crosscheck:
  circular_block_length_days: 14
  bootstrap_draws: 10000

# Phase-2 vessel-data feasibility gate. Passing supports an INFERRED LNG
# capacity-mile measure from terminal sequences, not observed cargo ton-miles.
vessel_data_feasibility:
  benchmark_vessels: 30
  min_identity_match_rate: 0.80
  min_port_visit_coverage_rate: 0.80
  min_terminal_endpoint_rate: 0.90
  max_median_ais_gap_hours: 24
  # GEM facility coordinates can be inland while GFW anchorages are offshore.
  # This creates candidates for audit, not automatic proof of a terminal call.
  terminal_match_max_km: 30
  # Exclude small-scale facilities that are implausible Q-Flex discharge points.
  min_terminal_capacity_mtpa: 1.0
  accepted_measure: "inferred_lng_capacity_nautical_miles"
  prohibited_measure_label: "observed_laden_cargo_ton_miles"
  route_distance:
    # Open shortest-path network estimate; it is not an observed AIS track.
    engine: "searoute"
    engine_version: "1.6.0"
    units: "naut"
    # Keep ordinary commercial passages available. The Arctic Northwest Passage
    # is excluded by default because it is not a plausible baseline LNG route.
    restrictions: ["northwest"]
    # Strict limit for terminal-to-network connectors, which are added to the
    # graph distance and retained separately for audit.
    max_endpoint_snap_nm: 30.0
    # Data-informed expanded sensitivity after the first graph-resolution audit.
    # The original 30 nm rule remains the strict specification.
    expanded_max_endpoint_snap_nm: 60.0
    # Numerical tolerance against the great-circle lower bound.
    min_route_to_geodesic_ratio: 0.95
    # High ratios are retained for audit but require manual review before use.
    review_route_to_geodesic_ratio: 3.0
  wto_departure_validation:
    terminal_match_radius_km: 30
    # Liquefaction origins geographically inside Hormuz. Oman Qalhat is outside
    # the strait and is deliberately excluded from this validation.
    gulf_export_project_ids:
      - "T100000130594"  # QatarEnergy LNG (N), Qatar
      - "T100000130601"  # Das Island LNG Terminal, United Arab Emirates
    comparison_windows:
      pre: ["2025-02-28", "2025-06-01"]
      post: ["2026-02-28", "2026-06-01"]
    daily_lag_sensitivity_days: [-3, -2, -1, 0, 1, 2, 3]
  importer_basin_exposure:
    terminal_match_radius_km: 30
    route_specification: "expanded_60nm_snap"
    # Country estimates are suppressed when post-disruption Hormuz support is
    # thinner than this. Basin aggregates remain descriptive and published.
    min_country_post_hormuz_exposed_voyages: 5
    gulf_export_project_ids:
      - "T100000130594"
      - "T100000130601"
    # Explicit destination-market classification. Pacific includes Asian and
    # Pacific-coast American terminals; Middle East is kept separate.
    destination_basin_by_country:
      Argentina: "Atlantic"
      Belgium: "Atlantic"
      Brazil: "Atlantic"
      Canada: "Atlantic"
      Colombia: "Atlantic"
      Croatia: "Atlantic"
