# ---------------------------------------------------------------------------
# A4 -- final Hormuz stress test. Plan v1.2 section 6 A4. This is the only
# phase that scores Hormuz, and the only phase authorised to read the August
# measurement state.
#
# The governing rule of this block is that NOTHING is estimated here. Every
# object A4 uses -- model, pooled standardiser, Hormuz context scale, threshold
# -- is built or loaded before a single Hormuz outcome row is read, and the
# system is digested at that moment. After scoring, the digest is recomputed and
# must be identical. That is what "no tuning after A4" is enforced by, rather
# than promised.
# ---------------------------------------------------------------------------
final:
  status: "frozen"
  frozen_on: "2026-08-28"
  frozen_under: "Mher's A3 acceptance and A4 authorisation, 2026-08-28"
  requires_confirmed_spec_hash: true
  confirmed_spec_hash_rationale: >-
    Plan A4 requires the script to refuse a configuration-hash mismatch. The
    operator passes the hash they recorded at acceptance time, so a silently
    edited configuration cannot be scored under the accepted design.

  measurement_states:
    scored: ["july", "august"]
    never_join_or_average: true
    august_authorisation:
      granted_by: "Mher"
      granted_on: "2026-08-28"
      scope: "A4 only"
      registry_entry: "portwatch_chokepoints_vintage_20260809_snapshot"
      allowed_consumer_added: "scripts/run_hormuz_detection.py"
      promotes_vintage: false
      averages_vintages: false
      note: >-
        August is scored as a separate state and its disagreement with July is
        the deliverable. No output mixes the two into one number.

  # `evaluated_forms` is the declaration the runner reads. It does not loop over
  # every detector form: a form that is not named here is not an evaluated cell
  # for that mode, and the coverage assertion below fails the run if one appears.
  modes:
    - id: 1
      name: "july_state_detectors"
      description: "July-state raw-level and scale-invariant detectors on Hormuz."
      evaluated_forms: ["raw_level", "scale_invariant"]
    - id: 2
      name: "august_state_detectors"
      description: "August-state raw-level and scale-invariant detectors on Hormuz."
      evaluated_forms: ["raw_level", "scale_invariant"]
    - id: 3
      name: "july_scale_invariant_transported_to_august"
      description: >-
        The frozen July scale-invariant detector applied to the August state,
        including its July-fitted Hormuz context scale, which is what makes it
        a transport test rather than a refit.
      evaluated_forms: ["scale_invariant"]
      evaluated_forms_rationale: >-
        Plan v1.2 A4 mode 3 declares a scale-invariant transport and nothing
        else. A raw-level transport is not a declared result: the raw-level
        score is not invariant to the proportional component of the vintage
        revision, so a raw-level cell under this pairing would confound the
        transport with the rescaling the decomposition exists to separate. The
        raw-level score is still computed and retained in the daily record for
        every scored day; it is simply not an evaluated cell. Nothing is hidden
        and no alarm is suppressed -- the six cells removed here were never
        declared, and their scores remain in the daily artefact.
    - id: 4
      name: "frozen_models_under_both_states"
      description: >-
        Frozen global model and seasonal naive under both states. Local AR(1,7)
        is a development-only baseline and is NOT scored on Hormuz: it needs a
        unit-specific fit that leave-Hormuz-out forbids. Amended in plan v1.2.
      models_scored_on_hormuz: ["global_ridge", "seasonal_naive"]
      local_ar_scored_on_hormuz: false

  hormuz_context_scale:
    rule: "fit_once_through_2025-11-30_and_hold_fixed"
    fitted_per_state: true
    fitted_per_state_rationale: >-
      Each measurement state gets its own Hormuz context scale, fitted on that
      state's own pre-surveillance history through 2025-11-30. Fitting one from
      a joined series would average the states, which is prohibited. Mode 3
      deliberately keeps the JULY scale when scoring August, because reusing the
      frozen object is the point of a transport test.
    refit_after_surveillance_starts: false

  comparisons:
    - "alarm_date"
    - "detection_delay_days_from_operational_onset"
    - "severity_7_day"
    - "severity_30_day"
    - "severity_rank_within_state"
    - "cross_state_agreement"

  cross_vintage_decomposition:
    required: true
    method: "proportional_rescaling_then_residual"
    definition: >-
      Regress the August Hormuz series on the July series through the origin over
      the pre-surveillance window to obtain a single positive proportionality
      constant. The component explained by proportional rescaling is what that
      constant reproduces; the remaining non-proportional residual revision is
      what it does not. The scale-invariant detector is invariant to the first
      component by construction, so only the second can move it.
    invariance_is_mathematical_not_empirical: >-
      A synthetic test multiplies a whole series by a positive constant and
      verifies the scale-invariant detector is unchanged. Agreement under that
      test is mathematical behaviour and is NOT evidence about the vintages. The
      empirical claim concerns departures from the proportional case only.

  post_hormuz_tuning:
    prohibited: true
    enforcement: "system_digest_before_and_after_plus_runtime_latch"
    enforcement_detail: >-
      Every estimated object is built before any Hormuz outcome row is read and
      digested at that point. Reading Hormuz outcomes sets a one-way latch; any
      fit, calibration or threshold selection attempted while the latch is set
      raises. After scoring the digest is recomputed and must equal the sealed
      one. Both the latch and the digest equality are reported as sealing
      assertions.
    thresholds_recomputed: false
    model_refitted: false
    scale_refitted: false

  # Exact-coverage contract. The evaluated cells must equal, as a set, the cross
  # product of each declared pairing mode's `evaluated_forms` with
  # `modes[4].models_scored_on_hormuz` and `tasks.horizons_days`. The run asserts
  # equality in both directions and fails on a missing or an undeclared cell.
  coverage:
    assert_exact: true
    dimensions: ["mode", "model", "horizon_days", "form"]
    note: >-
      Both directions matter. Missing cells alone would let a silently dropped
      model pass; undeclared cells alone would let an undeclared form pass. The
      undeclared-cell direction is what the mode 3 raw-level rows failed.

  # Every path a run writes is declared here and hashed into the manifest. The
  # revision file was previously written to a path derived from `cross_vintage`,
  # so no declaration named it and no hash covered it.
  outputs:
    daily: "data/processed/hormuz_detection_final_daily.csv"
    summary: "data/processed/hormuz_detection_final_summary.csv"
    cross_vintage: "data/processed/hormuz_detection_cross_vintage.csv"
    cross_vintage_revision: "data/processed/hormuz_detection_cross_vintage_revision.csv"
    manifest: "data/processed/hormuz_detection_final_manifest.json"

  # The checkpoint must be captured before the first output is written. Captured
  # afterwards it reports the run's own outputs as working-tree dirt, so it can
  # never distinguish a clean checkout from a dirty one.
  provenance:
    git_checkpoint_before_writing_outputs: true
    record_plan_hash: true
    record_input_hashes: true

  # A4 is a stress test; a pre-onset alarm is one of its findings. Counting them
  # is a reporting duty, never a licence to change a threshold or a window to
  # reduce the count. The stop condition after A4 is unchanged: no tuning.
  pre_onset_alarms:
    report: true
    suppress: false
    tuning_in_response_prohibited: true
