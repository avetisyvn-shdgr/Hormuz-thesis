version: 1
status: "frozen"
drafted_on: "2026-08-27"
plan: "docs/HORMUZ_TECHNICAL_EXECUTION_PLAN.md"
plan_version: "1.1"
phase: "B1"

states:
  july:
    label: "july"
    registry_variable: "portwatch_chokepoints_snapshot"
    path: "data/raw/portwatch/Daily_Chokepoints_Data.csv"
    expected_sha256: "66f3a54afb042103f3e0afc9670568cb7be245394ec04eba55ebd158593f579d"
    captured_note: "Pinned reporting basis; coverage to 2026-07-12."
    allow_sensitivity: false
  august:
    label: "august"
    registry_variable: "portwatch_chokepoints_vintage_20260809_snapshot"
    path: "data/raw/portwatch/vintages/Daily_Chokepoints_Data__vintage_2026-08-09.csv"
    expected_sha256: "0bc806a4c384723debff08053d6fcbb915a03ee9fdf7b23c73d76d9bcb885bcb"
    captured_note: "Sensitivity vintage captured 2026-08-09; coverage to 2026-08-02."
    allow_sensitivity: true

consumer: "scripts/run_hormuz_measurement_audit.py:b1_instrument_revision_audit"

panel:
  unit_column: "portname"
  date_column: "date"
  date_format: "%Y/%m/%d"
  n_units_expected: 28
  focus_unit: "Strait of Hormuz"
  primary_measure: "n_tanker"
  count_measures:
    - "n_tanker"
    - "n_container"
    - "n_dry_bulk"
    - "n_general_cargo"
    - "n_roro"
    - "n_cargo"
    - "n_total"
  capacity_measures:
    - "capacity_tanker"
    - "capacity_container"
    - "capacity_dry_bulk"
    - "capacity_general_cargo"
    - "capacity_roro"
    - "capacity_cargo"
    - "capacity"

windows:
  full_start: "2019-01-01"
  operational_onset: "2026-02-28"
  expected_overlap:
    start: "2019-01-01"
    end: "2026-07-12"
    n_days: 2750

mapping:
  default: "proportional_2019_2025"
  residual_evaluation: "full_overlap"
  forms:
    proportional_2019_2025:
      form: "proportional"
      sample_start: "2019-01-01"
      sample_end: "2025-12-31"
      role: "default"
      note: >
        Plan-declared default. Zero-intercept July-to-August mapping on
        overlapping daily observations, sample ending before the pre-onset
        surveillance interval.
    affine_2019_2025:
      form: "affine"
      sample_start: "2019-01-01"
      sample_end: "2025-12-31"
      role: "declared_sensitivity"
      note: "Plan-declared sensitivity: allows a non-zero intercept."
    proportional_2019_2026_02_27:
      form: "proportional"
      sample_start: "2019-01-01"
      sample_end: "2026-02-27"
      role: "declared_sensitivity"
      note: >
        Plan-declared sensitivity: extends the estimation sample through the
        pre-onset surveillance interval, ending the day before the locked
        operational onset.
    additive_2019_2025:
      form: "additive"
      sample_start: "2019-01-01"
      sample_end: "2025-12-31"
      role: "declared_sensitivity"
      note: "Constant-shift comparator; the plan requires an additive mapping."

residual_reporting:
  quantiles: [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99]
  split_on: "operational_onset"

wto:
  directory: "data/raw/wto_hormuz"
  glob: "*.csv"
  provenance: "data/raw/provenance.jsonl"
  provenance_variable: "wto_hormuz_lng_outbound_index"
  date_aliases: ["date", "voy_load_date"]
  value_aliases: ["value", "voy_intake_index"]
  regime_rule: "exact_equality_on_overlap_strict_clique"
  value_tolerance: 0.0

invariants:
  enforce: true
  checks:
    hormuz_pct_changed_n_tanker:
      expected: 97.4545
      tolerance: 0.001
      description: "Percent of overlapping Hormuz n_tanker rows that differ."
    next_highest_pct_changed_n_tanker:
      expected: 0.1091
      tolerance: 0.001
      expected_unit: "Malacca Strait"
      description: "Second-highest chokepoint by changed-row percentage."
    median_pct_changed_n_tanker:
      expected: 0.0364
      tolerance: 0.001
      description: "Median changed-row percentage across all 28 chokepoints."
    hormuz_annual_ratio_n_tanker:
      expected:
        2019: 0.843
        2020: 0.848
        2021: 0.842
        2022: 0.827
        2023: 0.825
        2024: 0.818
        2025: 0.826
      tolerance: 0.0005
      description: "August/July annual Hormuz tanker-count ratios."

outputs:
  by_chokepoint: "data/processed/portwatch_instrument_shift_by_chokepoint.csv"
  hormuz_daily: "data/processed/portwatch_hormuz_revision_daily.csv"
  hormuz_annual: "data/processed/portwatch_hormuz_revision_annual.csv"
  wto_audit: "data/processed/wto_measurement_state_audit.csv"
  manifest: "data/processed/hormuz_measurement_state_manifest.json"

limitations:
  - "Two captures of the same period; the provider-side reason for the revision is not observed and is not claimed."
  - "The proportional/non-proportional split is relative to one frozen estimator, not a measurement-error model."
  - "A purely multiplicative revision cancels under within-series normalisation, so cross-state agreement after normalisation is arithmetic, not evidence."
  - "Post-onset overlap is short relative to pre-onset; post-onset residual statistics are thin and are not a treatment signal."
  - "WTO regime grouping uses exact equality over unequal overlap windows; the relation is not transitive and the clique rule is a reporting convention."
  - "No causal, ATT, or provider-intent interpretation is authorised by this phase."
