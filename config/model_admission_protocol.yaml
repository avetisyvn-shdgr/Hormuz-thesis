    This ex post checkpoint constrains remaining reporting discretion. It does
    not establish that the four-model roster was selected without knowledge of
    the pinned-vintage results, August outcome path, August AR sensitivity
    results, or pre-treatment TSFM validation results.
  results_known_before_this_lock:
    - "All pinned-vintage rows declared below."
    - "All six rows of data/processed/portwatch_vintage_sensitivity.csv."
    - "The complete August PortWatch outcome path through 2026-08-02."
    - "The pre-treatment TSFM admission and calibration table."
  results_seen_during_precheckpoint_independent_audit:
    status: "assistant_in_memory_values_not_yet_frozen_or_human_verified"
    note: >-
      After the earlier unanchored v1 draft but before this corrected lock, an
      independent read-only audit also observed approximate August same-window
      seasonal-naive and BSTS results. The four-model roster was not changed.
    values:
      - model: "seasonal_naive_7d"
        vintage: "vintage_20260809"
        mean_daily_common_point_shortfall_approx: 43.700000
      - model: "bsts_local_level_weekly"
        vintage: "vintage_20260809"
        mean_daily_common_point_shortfall_approx: 40.167457
        mean_daily_model_native_shortfall_approx: 40.110773

scope:
  outcome: "hormuz_tanker_transits"
  outcome_column: "n_tanker"
  outcome_construct: "PortWatch daily all-tanker transit count at the Strait of Hormuz"
  unit: "transits_per_day"
  analysis_start: "2022-01-01"
  training_end: "2026-02-27"
  locked_cutoff: "2026-02-28"
  scoring_end: "2026-07-07"
  expected_scored_days: 130
  expected_observed_sum_pinned: 529.0
  permitted_information: "outcome history dated no later than 2026-02-27"
  forbidden_information: "observed post-cutoff covariates or donor outcomes"
  vintage_rule: "run each frozen vintage separately; never average vintages"

comparison_sets:
  representative_same_information_range_members:
    - "seasonal_naive_7d"
    - "ar_lag1_7"
    - "chronos2"
    - "bsts_local_level_weekly"
  additional_preperiod_admitted_not_matrix_run:
    - "timesfm"
    - "moirai"
  conditional_postcovariate_rows:
    - "arx_lag1_7_route"
    - "arx_lag1_7_route_energy"
  noncomparable_corroboration_rows:
    - "synthetic_control"
  test_fixture_rows:
    - "stub_seasonal"
  primary_range_label: "selected_four_specification_same_information_range"
  all_preperiod_admitted_range_status: "not_estimated_missing_common_window_timesfm_and_moirai_cells"
  mixed_information_range_status: "not_computed_information_sets_differ"
  synthetic_range_status: "not_computed_units_not_directly_comparable"

representative_selection:
  foundation_model: "chronos2"
  status_code: "INCLUDE_HISTORICALLY_IMPLEMENTED_FAMILY_REPRESENTATIVE"
  rationale: >-
    Chronos-2 was documented as the first engineering candidate and implemented
    as the default robustness path before its post-period output was committed.
    It had the smallest absolute matched-fold coverage error, supports the
    requested native 95% interval, and is integrated in run_all. It did not win
    every point metric: TimesFM had the lower local transit MASE.
  implementation_precedence:
    default_runner_commit: "41c3c92"
    postperiod_output_commit: "f15f0e9"
  preperiod_evidence:
    source: "data/processed/tsfm_admission_test.csv"
    source_sha256: "51784d4547050456717204bac5a651e983c0414708db0e6ff53e837e457402a2"
    target: "hormuz_tanker_transits"
    chronos2_mase: 0.8000367817891185
    chronos2_abs_coverage_error: 0.01231884057971
    timesfm_mase: 0.7817235577336589
    timesfm_abs_coverage_error: 0.0536231884057971
    moirai_mase: 0.8399183851679082
    moirai_abs_coverage_error: 0.0478260869565217

central_statistic:
  description: >-
    Sum each scored day's point or marginal-median prediction minus the observed
    outcome and divide by the common 130 days. Model-native joint summaries are
    secondary. This is a case-local sensitivity range, not a variance
    decomposition, pooled estimate, uncertainty interval, or general AIS claim.
  seasonal_naive_7d: "mean(y_pred - y_true) over the 130 scored days"
  ar_lag1_7: "mean(y_pred - y_true) over the 130 scored days"
  chronos2: "mean(daily q0.5 prediction - y_true) over the 130 scored days"
  bsts_local_level_weekly: "mean(daily marginal posterior median - y_true) over the 130 scored days"
  bsts_model_native_secondary: "joint cumulative posterior median divided by 130"

models:
  - model: "seasonal_naive_7d"
    estimator_family: "seasonal_benchmark"
    pre_treatment_admission_passed: true
    pinned_130_day_support_verified: true
    same_information_contract: true
    representative_matrix_selected: true
    status_code: "INCLUDE_PREDECLARED_BENCHMARK"
    fit_inputs: "pre-cutoff outcome history only"
    post_outcome_ingested: false
    post_covariates_ingested: false
    reason: "Predeclared transparent benchmark in actual transit units."
  - model: "ar_lag1_7"
    estimator_family: "autoregressive_primary"
    pre_treatment_admission_passed: true
    pinned_130_day_support_verified: true
    same_information_contract: true
    representative_matrix_selected: true
    status_code: "INCLUDE_LOCKED_PRIMARY"
    fit_inputs: "pre-cutoff outcome history only"
    post_outcome_ingested: false
    post_covariates_ingested: false
    reason: "Locked working primary in actual transit units."
  - model: "chronos2"
