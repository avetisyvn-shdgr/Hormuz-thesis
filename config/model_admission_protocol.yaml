    pre_treatment_admission_passed: true
    pinned_130_day_support_verified: true
    same_information_contract: true
    representative_matrix_selected: true
    status_code: "INCLUDE_HISTORICALLY_IMPLEMENTED_FAMILY_REPRESENTATIVE"
    fit_inputs: "pre-cutoff outcome context and frozen pretrained weights"
    post_outcome_ingested: false
    post_covariates_ingested: false
    reason: "Existing calibration-anchor robustness implementation; not selected as universal MASE winner."
  - model: "bsts_local_level_weekly"
    estimator_family: "bayesian_state_space"
    pre_treatment_admission_passed: true
    pinned_130_day_support_verified: true
    same_information_contract: true
    representative_matrix_selected: true
    status_code: "INCLUDE_EXISTING_STATE_SPACE_CROSSCHECK"
    fit_inputs: "pre-cutoff outcome history and fixed prior settings"
    post_outcome_ingested: false
    post_covariates_ingested: false
    reason: "Existing outcome-only state-space cross-check in actual transit units."
  - model: "timesfm"
    estimator_family: "foundation_time_series"
    pre_treatment_admission_passed: true
    pinned_130_day_support_verified: false
    same_information_contract: true
    representative_matrix_selected: false
    status_code: "NOT_RUN_COMMON_WINDOW_ADDITIONAL_FAMILY_MEMBER"
    fit_inputs: "pre-cutoff outcome context and frozen pretrained weights"
    post_outcome_ingested: false
    post_covariates_ingested: false
    reason: "Passed the pre-period gate, but no frozen common-window 130-day comparison cell exists."
  - model: "moirai"
    estimator_family: "foundation_time_series"
    pre_treatment_admission_passed: true
    pinned_130_day_support_verified: false
    same_information_contract: true
    representative_matrix_selected: false
    status_code: "NOT_RUN_COMMON_WINDOW_ADDITIONAL_FAMILY_MEMBER"
    fit_inputs: "pre-cutoff outcome context and frozen pretrained weights"
    post_outcome_ingested: false
    post_covariates_ingested: false
    reason: "Passed the pre-period gate, but no frozen common-window 130-day comparison cell exists."
  - model: "arx_lag1_7_route"
    estimator_family: "conditional_autoregression"
    pre_treatment_admission_passed: true
    pinned_130_day_support_verified: true
    same_information_contract: false
    representative_matrix_selected: false
    status_code: "EXCLUDE_OBSERVED_POST_COVARIATES"
    fit_inputs: "outcome history plus Panama route covariates"
    post_outcome_ingested: false
    post_covariates_ingested: true
    reason: "Uses observed post-cutoff route covariates; visible as a same-unit mixed-information sensitivity only."
  - model: "arx_lag1_7_route_energy"
    estimator_family: "conditional_autoregression"
    pre_treatment_admission_passed: true
    pinned_130_day_support_verified: true
    same_information_contract: false
    representative_matrix_selected: false
    status_code: "EXCLUDE_OBSERVED_POST_COVARIATES"
    fit_inputs: "outcome history plus Panama route and energy covariates"
    post_outcome_ingested: false
    post_covariates_ingested: true
    reason: "Uses observed post-cutoff route and energy covariates; visible as a same-unit mixed-information sensitivity only."
  - model: "synthetic_control"
    estimator_family: "donor_weighted_comparison"
    pre_treatment_admission_passed: false
    pinned_130_day_support_verified: true
    same_information_contract: false
    representative_matrix_selected: false
    status_code: "EXCLUDE_POST_DONORS_AND_MEAN_SCALED_UNITS"
    fit_inputs: "pre-cutoff donor fit plus post-cutoff donor outcomes"
    post_outcome_ingested: false
    post_covariates_ingested: true
    reason: "Uses post-cutoff donors and reports mean-scaled transit equivalents, not direct transit-count forecasts."
