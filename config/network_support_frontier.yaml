schema_version: 1
design_id: "lng_selective_network_support_frontier_v1"
frozen_utc: "2026-08-09T23:32:47Z"
analysis_role: "modeled_network_support_denominator_audit"

freeze_status:
  timing: "frozen_before_generation_not_preregistered"
  prior_disclosure:
    - "Audit expectation that 30 km Hormuz-crossing support moves 145 -> 2 sequences."
    - "Audit expectation that 30 km total resolved sequences move 971 -> 746."
  upstream_g4:
    horizon_resolution_frontier:
      status: "verified"
      local_date: "2026-08-10"

upstream_registered_artifacts:
  capacity_voyages:
    path: "data/processed/inferred_capacity_nautical_miles_voyages.csv"
    sha256: "f88f0bafec05f35c9322abeea40d8749cf43ccb4d6f820151e959fee291c26c0"
    role: "resolved_sequence_input"
    registry_provenance: "built by scripts/build_inferred_capacity_nautical_miles.py from registry-logged GFW and GEM pulls"
  terminal_matching_audit:
    path: "data/processed/global_lng_terminal_matching_audit.csv"
    sha256: "18fa5ef28179bbf64d17d534a36c95a417d7651665bd6e6f8caf9d645511b545"
    role: "destination_country_and_role_crosswalk"
    registry_provenance: "built by scripts/build_global_lng_terminal_crosswalk.py from the registered GEM terminal snapshot"
  carrier_frame:
    path: "data/interim/global_lng_carrier_frame.csv"
    sha256: "bfa5c896f98e59aeb55d3f438701478920d0469ba0bdf76cc151a8c9ca1e0fe7"
    role: "census_denominator"
    registry_provenance: "built by scripts/build_global_carrier_frame.py under the eligible_fleet_census sampling design"
  capacity_comparison:
    path: "data/processed/inferred_capacity_nautical_miles_comparison.csv"
    sha256: "ff2025acf7d64171f01dd22d30f375a697a078f424afaa733e90daf0001d232e"
    role: "locked_radius_comparison_artifact_read_only"

terminal_radius_km_grid: [10, 20, 30]
primary_terminal_radius_km: 30
radius_rationale: >-
  30 km is the terminal_match_max_km already locked in settings.yaml for the
  vessel branch. 10 km and 20 km are stricter alternatives that trade recall for
  precision in terminal attribution. The grid is complete and every radius is
  reported whatever it shows.

cohorts:
  all_resolved:
    definition: "endpoint_status == resolved_liquefaction_to_regasification"
    role: "overall_denominator"
  hormuz_crossing:
    definition: "resolved AND origin project in gulf_export_project_ids AND 'ormuz' in modeled route_passages"
    role: "selective_denominator"
    source_flag: "exposure.hormuz_exposed_leg"
  inside_hormuz_non_crossing:
    definition: "resolved AND origin project in gulf_export_project_ids AND route does not transit Hormuz"
    role: "diagnostic_contrast"
  non_gulf:
    definition: "resolved AND origin project not in gulf_export_project_ids"
    role: "diagnostic_contrast"

periods: ["pre", "post"]

denominator_metrics:
  - "n_sequences"
  - "n_unique_imos"
  - "n_destination_countries"
  - "n_destination_terminals"
  - "n_origin_terminals"

census_coverage:
  denominator: "eligible_fleet_census_imos"
  numerator: "imos_with_at_least_one_resolved_sequence_in_the_cell"
  note: >-
    Census coverage is the share of the eligible carrier census that appears at
    all in a cell. It is a support-observation share, never a fleet-utilisation
    or throughput share.

balanced_cohort:
  definition: "IMOs with at least one resolved sequence in BOTH pre and post within the same radius"
  role: >-
    Holds the observed carrier set fixed so that a support change cannot be
    produced purely by carriers entering or leaving the resolved panel.

thin_denominator_threshold_sequences: 10

audit_expectation:
  terminal_radius_km: 30
  hormuz_crossing_pre_sequences: 145
  hormuz_crossing_post_sequences: 2
  all_resolved_pre_sequences: 971
  all_resolved_post_sequences: 746

outputs:
  denominators_csv: "data/processed/network_support_denominators.csv"
  radius_sensitivity_csv: "data/processed/network_support_radius_sensitivity.csv"
  balanced_cohort_csv: "data/processed/network_support_balanced_cohort.csv"
  diagnostics_json: "data/processed/network_support_diagnostics.json"
  audit_expectation_json: "data/processed/network_support_audit_expectation.json"
  documentation_markdown: "reports/audit/network_support_frontier.md"
  manifest_json: "data/processed/network_support_frontier_manifest.json"

reporting_guards:
  is_ATT: false
  is_causal_identification: false
  missing_edge_interpretation: >-
    A missing modeled edge is a missing observation in the resolved-sequence
    panel. It is NOT evidence that no ship sailed, that a route was physically
    impossible, or that throughput fell to the modeled level. Loss of support
    and loss of sailing are different propositions and this phase can only
    measure the first.
  ais_dark_throughput_inference_permitted: false
  ais_dark_note: >-
    Sequences vanish from this panel when AIS coverage, terminal attribution,
    or route resolution fails, and those failure modes are themselves plausibly
    correlated with the disruption. No daily or aggregate physical throughput
    may be inferred from a support count.
  construct_label: "modeled resolved terminal-sequence support, not observed voyages"
  denominator_discipline: >-
    Every selective statement must be paired with its overall denominator in the
    same radius and period. A Hormuz-crossing count may never be reported alone.
  overwrite_policy: "upstream_capacity_and_comparison_artifacts_are_read_only_in_this_phase"
  core_run_all_dependency: "required_for_final_integration"
  core_reproducibility_manifest_dependency: "none"
