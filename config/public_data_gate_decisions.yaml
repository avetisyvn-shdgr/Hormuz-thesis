candidates:
  era5_reanalysis:
    display_name: "ECMWF ERA5 reanalysis"
    status: "DEFER_PENDING_SCOPE_REOPENING"
    permitted_use: >-
      A weather falsification check only: testing whether meteorological
      conditions in the treated window could plausibly account for part of the
      observed transit decline.
    prohibited_use: >-
      Not a treatment, not a control in the throughput specification, not a
      mechanism layer, and never a co-determinant added to the locked AR model.
    required_rights: "Copernicus licence; redistribution of derived values permitted with attribution"
    coverage: "Global hourly reanalysis covering the full study window"
    reporting_lag: "About five days, adequate for the treated window"
    estimand_relevance: >-
      Low and strictly falsificationist. A null weather result would slightly
      strengthen the existing counterfactual reading; a non-null result would
      not identify anything, because weather is not the treatment.
    kill_criteria:
      - "Any use that adds ERA5 as a regressor to the locked primary specification."
      - "Any framing in which a weather association is reported as a mechanism."
      - "Acquisition before an explicit written scope reopening by the thesis author."
    reopening_required: true

  sentinel1_sar:
    display_name: "Sentinel-1 SAR ship detections"
    status: "DEFER_POST_SUBMISSION"
    permitted_use: >-
      Post-submission, scene-level vessel-occupancy validation only: checking
      whether independent satellite observation is consistent with the modeled
      support collapse documented in the network-support frontier.
    prohibited_use: >-
      Never a daily AIS-dark throughput multiplier, never a scaling factor
      applied to unobserved sequences, and never a substitute for the
      support-limited construct.
    required_rights: "Copernicus open licence; scene processing capability unconfirmed on this hardware"
    coverage: "Scene-level, revisit-limited; not daily and not continuous"
    reporting_lag: "Scene-dependent; processing burden is the binding constraint, not latency"
    estimand_relevance: >-
      Moderate as corroboration, nil as identification. Yang et al. 2026 already
      observe this event with Sentinel-1, so this is a validation avenue rather
      than a novelty claim, and the thesis must not present it as first
      observation.
    kill_criteria:
      - "Any conversion of scene occupancy into a daily throughput estimate."
      - "Any use before thesis submission, which would displace writing."
      - "Any claim of first or independent observation of the 2026 event."
    reopening_required: true

  gfw_hourly_presence:
    display_name: "Global Fishing Watch hourly AIS presence"
    status: "DEFER_PENDING_SCOPE_REOPENING"
    permitted_use: >-
      Coarse loitering or dwell-duration proxies only, at grid resolution,
      as a descriptive diagnostic on the already-registered vessel branch.
    prohibited_use: >-
      Never continuous global track reconstruction, never vessel-level distance
      recomputation, and never a replacement for the modeled shortest-sea-route
      distance used in the route-burden construct.
    required_rights: "Existing GFW account and token; the public presence product is gridded, not raw tracks"
    coverage: "Gridded presence; identity resolution weaker than the registered port-visit product"
    reporting_lag: "Product-dependent; not a binding constraint"
    estimand_relevance: >-
      Low. It could sharpen dwell diagnostics but cannot repair the missing-edge
      support problem, because the same AIS gaps that remove a sequence from the
      panel also degrade presence.
    kill_criteria:
      - "Any attempt to reconstruct individual vessel tracks from gridded presence."
      - "Any recomputation of route distance that would silently change the frozen construct."
      - "Any use that implies AIS-dark sequences have been observed."
    reopening_required: true

  jodi_gas:
    display_name: "JODI-Gas national statistics"
    status: "NO_GO"
    permitted_use: >-
      National macro context only, and only if the blocking conditions below are
      ever cleared.
    prohibited_use: >-
      Never an origin-split confirmatory importer panel and never a
      quantity-basis substitute for the customs evidence.
    required_rights: "Redistribution rights UNRESOLVED for the derived series"
    coverage: "Free bulk CSV is stale and ends 2018-12; live data sits behind a portal whose refresh path is unconfirmed"
    reporting_lag: "Inadequate for the post-event window even if access were resolved"
    estimand_relevance: >-
      Nil under current support. The series cannot cover the treated window, so
      it cannot inform the estimand at all.
    kill_criteria:
      - "Stale coverage ending 2018-12 (already triggered)."
      - "Unresolved redistribution rights for any derived series (already triggered)."
      - "Post-event reporting lag longer than the treated window (already triggered)."
    reopening_required: true
    blocking_reason: >-
      Two independent kill criteria are already met. This is a NO_GO on the
      facts, not a deferral pending preference.

  marad_advisories:
    display_name: "US MARAD maritime advisories"
    status: "DEFER_PENDING_SCOPE_REOPENING"
    permitted_use: >-
      Operational chronology corroboration only: cross-checking dates already
      recorded in EVENT_CHRONOLOGY.md against an additional official source.
    prohibited_use: >-
      Never identification, never a treatment-date selector, and never a
      quantitative input. The locked 2026-02-28 cutoff does not move on the
      strength of an advisory.
    required_rights: "US government public domain; attribution expected"
    coverage: "Advisory text only; no vessel, terminal, or quantity fields"
    reporting_lag: "Near real time"
    estimand_relevance: >-
      Nil for identification, modest for narrative accuracy. It could corroborate
      the chronology already audited on 2026-06-19 but adds no estimand content.
    kill_criteria:
      - "Any use that moves or re-derives the operational-onset cutoff."
      - "Any subjective text coding turned into a quantitative variable."
      - "Any presentation of advisory language as evidence of throughput."
    reopening_required: true

