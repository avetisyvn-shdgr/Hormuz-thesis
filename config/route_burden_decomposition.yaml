construct:
  label: "modeled distance per nominal vessel-capacity m3 among retained inferred voyages"
  outcome_column: "inferred_nominal_m3_nm_expanded"
  unit: "nominal m3 x modeled nautical miles per retained sequence"
  statistic: "arithmetic mean over retained sequences within a period"
  route_specification: "expanded_60nm_snap"
  prohibited_labels:
    - "observed cargo ton-miles"
    - "physical rerouting"
    - "evidence that individual ships sailed farther"
    - "laden cargo ton-miles"
    - "observed voyage distance"
  interpretation: >-
    Nominal vessel capacity is a design property of the carrier, not a measured
    cargo quantity, and the distance is a modeled shortest-sea-route estimate,
    not an observed AIS track. The product therefore describes the modeled
    burden profile of the sequences that remain observable, not what any
    individual ship physically did.

complete_case_rule:
  endpoint_status: "resolved_liquefaction_to_regasification"
  requires_non_null_outcome: true
  exclusions_reported: true

terminal_radius_km_grid: [10, 20, 30]
primary_terminal_radius_km: 30

decomposition:
  pair_key: ["project_id", "destination_project_id"]
  pair_key_label: "origin_terminal_project -> destination_terminal_project"
  components:
    common_pair_share_reweighting:
      formula: "sum over common pairs of (sigma_post - sigma_pre) * (m_pre + m_post) / 2"
      meaning: "shift of retained-sequence mass across terminal pairs present in both periods"
    within_common_pair_capacity_mix:
      formula: "sum over common pairs of ((sigma_pre + sigma_post) / 2) * (m_post - m_pre)"
      meaning: "change in mean nominal capacity carried on the same terminal pair"
    entry_exit_residual:
      formula: "total_change - common_pair_share_reweighting - within_common_pair_capacity_mix"
      meaning: "contribution of terminal pairs supported in only one period"
      identity: >-
        Equals (Y_post - Y_common_post) - (Y_pre - Y_common_pre), the differenced
        gap between the overall mean and the common-pair conditional mean.
  sigma_definition: "within-period share of retained sequences among COMMON pairs only, renormalised to sum to one"
  m_definition: "within-pair mean of the outcome column in that period"
  reconciliation:
    required: true
    tolerance_absolute: 1.0e-06
    note: "The three components must sum to the total change exactly, up to floating point."
  percent_stability:
    ratio_definition: "max(|component|) / |total_change|"
    unstable_above_ratio: 2.0
    policy: "absolute components in m3-nm are always primary; percentages are suppressed in the narrative for unstable cells"

weighting_schemes:
  symmetric_marshall_edgeworth:
    role: "primary"
    share_weight: "average of pre and post within-pair means"
    within_weight: "average of pre and post common-pair shares"
    rationale: >-
      Symmetric in the two periods, so neither is privileged as the index base.
      Chosen on that methodological ground before the component values were read.
  laspeyres_share_paasche_within:
    role: "sensitivity"
    share_weight: "pre-period within-pair means"
    within_weight: "post-period common-pair shares"
  paasche_share_laspeyres_within:
    role: "sensitivity"
    share_weight: "post-period within-pair means"
    within_weight: "pre-period common-pair shares"

support_bounds:
  report_pair_counts: true
  report_entering_and_exiting_pairs: true
  report_excluded_sequence_counts: true
  both_period_carrier_restriction:
    definition: "IMOs with at least one retained sequence in BOTH periods at the same radius"
    role: "holds the observed carrier set fixed so composition cannot be produced by carrier turnover"
  censoring_note: >-
    Right-censored and unresolved sequences never enter the complete case. The
    decomposition therefore describes retained sequences only, and its total is
    conditional on the support documented by the task-7 network-support
    frontier. Sequences that left the panel are not assigned a burden value of
    zero and are not assumed to have carried the pre-period average.

audit_expectation:
  terminal_radius_km: 30
  weighting_scheme: "symmetric_marshall_edgeworth"
  total_change_m3_nm_per_retained_sequence: 67585181.55385447
  total_change_tolerance: 1000.0
  common_pair_share_reweighting_percent: 54.9
  entry_exit_residual_percent: 43.8
  within_common_pair_capacity_mix_percent: 1.3
  component_percent_tolerance: 0.1

outputs:
  decomposition_csv: "data/processed/route_burden_decomposition.csv"
  weighting_sensitivity_csv: "data/processed/route_burden_weighting_sensitivity.csv"
  pair_support_csv: "data/processed/route_burden_pair_support.csv"
  diagnostics_json: "data/processed/route_burden_diagnostics.json"
  audit_expectation_json: "data/processed/route_burden_audit_expectation.json"
  documentation_markdown: "reports/audit/route_burden_decomposition.md"
  manifest_json: "data/processed/route_burden_decomposition_manifest.json"

reporting_guards:
  is_ATT: false
  is_causal_identification: false
  is_observed_cargo_ton_miles: false
  is_physical_rerouting_evidence: false
  implies_individual_ships_sailed_farther: false
  ais_dark_throughput_inference_permitted: false
  construct_label_required_verbatim: true
  component_split_does_not_generalise: >-
    The reproduced 54.9 / 43.8 / 1.3 split is specific to the 30 km all-retained
    cell under symmetric weighting. It is not stable across the radius grid or
    the both-period carrier restriction, and that instability must be reported
    wherever the split is quoted.
  composition_not_behaviour: >-
    A rise in the mean burden per retained sequence is a statement about which
    sequences remain observable and how their modeled attributes are
    distributed. It is not a measurement of any vessel travelling a longer
    distance than before.
  overwrite_policy: "upstream_capacity_comparison_and_task7_artifacts_are_read_only_in_this_phase"
  core_run_all_dependency: "required_for_final_integration"
  core_reproducibility_manifest_dependency: "none"
