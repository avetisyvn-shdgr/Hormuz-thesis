version: 1
status: "exploratory_retrospective_restriction"
frozen_on: "2026-08-29"

claim: >-
  Positive abnormal tanker activity compatible with network adaptation or
  alternative-source substitution; not physical rerouting, displaced volume,
  or a causal treatment effect.

data:
  source: "IMF PortWatch Daily Chokepoints Data"
  file: "data/raw/portwatch/Daily_Chokepoints_Data.csv"
  sha256: "66f3a54afb042103f3e0afc9670568cb7be245394ec04eba55ebd158593f579d"
  cutoff_exclusive: "2026-02-28"
  event_horizon_days: 130
  event_end_inclusive: "2026-07-07"
  calibration_start: "2023-01-01"
  calibration_end_inclusive: "2025-11-05"

models:
  primary:
    name: "chronos2_univariate"
    revision: "29ec3766d36d6f73f0696f85560a422f50e8498c"
    context_length: 2048
    cross_learning: false
  robustness:
    name: "ar_lag1_7"
    lags: [1, 7]

inference:
  statistic: "mean_observed_minus_counterfactual_scaled_by_pre_event_mean"
  alternative: "greater"
  bootstrap: "synchronized_circular_moving_block"
  primary_block_length_days: 14
  sensitivity_block_lengths_days: [7, 28]
  draws: 10000
  seed: 20260829
  multiplicity: "Romano-Wolf step-down within each explicitly named family"
  historical_residuals: >-
    Pre-event out-of-sample 130-day forecast residual vectors from eight common,
    disjoint rolling origins in the executed 28 x 5 panel bake-off. Blocks are
    sampled at common time indices across hypotheses to preserve contemporaneous
    cross-corridor dependence.

primary_family:
  vessel_class: "n_tanker"
  corridors:
    - portname: "Cape of Good Hope"
      rationale: "Atlantic/Indian Ocean long-haul route and supply-reorganization screen."
    - portname: "Malacca Strait"
      rationale: "Major Asia-bound energy gateway and destination-side adaptation screen."
    - portname: "Gibraltar Strait"
      rationale: "Atlantic-Mediterranean gateway and European alternative-supply screen."
    - portname: "Panama Canal"
      rationale: "Americas-to-Pacific fleet-deployment and alternative-supply screen."
    - portname: "Yucatan Channel"
      rationale: "US Gulf/Caribbean export gateway and Atlantic-supply screen."

context_series:
  vessel_class: "n_tanker"
  corridors:
    - "Strait of Hormuz"
    - "Suez Canal"
    - "Bab el-Mandeb Strait"
  role: >-
    Descriptive sign and timing checks only. Hormuz is the disruption anchor;
    Suez and Bab el-Mandeb are exposed to concurrent regional shocks and are not
    untreated donors or positive-adaptation hypotheses.

negative_control_family:
  vessel_classes: ["n_roro", "n_dry_bulk"]
  corridors:
    - "Cape of Good Hope"
    - "Malacca Strait"
    - "Gibraltar Strait"
    - "Panama Canal"
    - "Yucatan Channel"
  interpretation: >-
    Positive control-class anomalies at the same corridors weaken a
    tanker-specific adaptation interpretation; null controls do not prove the
    tanker mechanism.
  volume_eligibility:
    minimum_pre_event_daily_transits: 5.0
    computed_on: "pre_event_observations_only"
    declared_in: "Research Record/plan-technical-remediation.md item T1.1"
    rationale: >-
      The equal-weighted global control statistic gives a series averaging under
      two transits a day the same weight as one averaging fifty. A control whose
      historical reference range is several times its own mean cannot falsify
      much, so the specificity test may pass because the control distribution is
      wide rather than because the tanker signal is specific.
  weighting_schemes:
    - "equal"
    - "inverse_reference_variance"
    - "pre_event_volume"

outputs:
  event_forecasts: "experiments/network_adaptation/outputs/event_forecasts.csv.gz"
  event_manifest: "experiments/network_adaptation/outputs/event_forecasts_manifest.json"
  inference: "experiments/network_adaptation/outputs/network_adaptation_inference.csv"
  global_tests: "experiments/network_adaptation/outputs/network_adaptation_global_tests.csv"
  model_comparison: "experiments/network_adaptation/outputs/network_adaptation_model_comparison.csv"
  validation: "experiments/network_adaptation/outputs/network_adaptation_validation.json"
  manifest: "experiments/network_adaptation/outputs/network_adaptation_manifest.json"
  specification_sensitivity: "experiments/network_adaptation/outputs/hormuz_shortfall_specification_sensitivity.csv"
  specification_sensitivity_manifest: "experiments/network_adaptation/outputs/hormuz_shortfall_specification_sensitivity_manifest.json"
  cape_drift: "experiments/network_adaptation/outputs/cape_residual_drift.csv"
  cape_drift_summary: "experiments/network_adaptation/outputs/cape_residual_drift_summary.csv"
  cape_drift_manifest: "experiments/network_adaptation/outputs/cape_residual_drift_manifest.json"
  cape_drift_figure: "reports/figures/cape_residual_drift.png"
  control_robustness: "experiments/network_adaptation/outputs/control_family_robustness.csv"
  control_robustness_manifest: "experiments/network_adaptation/outputs/control_family_robustness_manifest.json"
  all_corridor_ranking: "experiments/network_adaptation/outputs/all_corridor_ranking.csv"
  all_corridor_global_tests: "experiments/network_adaptation/outputs/all_corridor_global_tests.csv"
  all_corridor_manifest: "experiments/network_adaptation/outputs/all_corridor_ranking_manifest.json"
  all_corridor_figure: "reports/figures/all_corridor_ranking.png"
  figure_png: "reports/figures/network_adaptation_counterfactuals.png"
  figure_pdf: "reports/figures/network_adaptation_counterfactuals.pdf"
